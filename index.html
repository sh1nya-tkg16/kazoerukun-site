<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かぞえるくん</title>
<style>
:root{--bg:#fff;--fg:#1d2430;--mut:#5a6577;--line:#d9dee7;--acc:#1c6b52;--soft:#f3f6f9;--warn:#fff7e0}
@media (prefers-color-scheme:dark){:root{--bg:#14181f;--fg:#e6e9ee;--mut:#9aa5b5;--line:#2c3441;--acc:#6fcfa9;--soft:#1b212b;--warn:#2a2514}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",Meiryo,sans-serif;line-height:1.85;font-size:16px;-webkit-text-size-adjust:100%}
main{max-width:46rem;margin:0 auto;padding:20px 16px 64px}
h1{font-size:1.5rem;line-height:1.4;margin:.4em 0 .8em}
h2{font-size:1.2rem;margin:2.2em 0 .6em;padding-bottom:.3em;border-bottom:2px solid var(--acc)}
h3{font-size:1.05rem;margin:1.6em 0 .4em}
p,ul,ol{margin:.7em 0}
ul,ol{padding-left:1.4em}
li{margin:.3em 0}
a{color:var(--acc);word-break:break-all}
hr{border:0;border-top:1px solid var(--line);margin:2.4em 0}
blockquote{margin:1em 0;padding:.2em 1em;background:var(--soft);border-left:4px solid var(--acc);color:var(--fg)}
.tw{overflow-x:auto;margin:1em 0}
table{border-collapse:collapse;width:100%;font-size:.92rem;min-width:30rem}
th,td{border:1px solid var(--line);padding:.5em .6em;text-align:left;vertical-align:top}
th{background:var(--soft)}
@media (max-width:600px){
 table{min-width:0}
 thead{display:none}
 tr{display:block;border:1px solid var(--line);margin:0 0 .8em;border-radius:6px;overflow:hidden}
 td{display:block;border:0;border-bottom:1px solid var(--line)}
 td:last-child{border-bottom:0}
 td::before{content:attr(data-label);display:block;font-size:.78rem;color:var(--mut);font-weight:bold}
}
</style>
</head>
<body>
<main>
<h1>かぞえるくん</h1>
<p>写真を撮るだけ。AIが数えます。シール、部品、お菓子、コレクション。散らばったものを一瞬でカウント。</p>

<li><a href="support.html">サポート（よくある質問・お問い合わせ）</a></li>
<li><a href="privacy.html">プライバシーポリシー</a></li>
</ul>
<p>提供者：ProcessRidge</p>
</main>
</body>
</html>
